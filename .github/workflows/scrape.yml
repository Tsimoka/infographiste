name: Scrape Google Maps (wellness)

on:
  workflow_dispatch:

# Accorde les permissions d'écriture pour que le bot puisse push sans rejet de GitHub
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          # Récupère tout l'historique pour éviter les conflits de rebase lors du push
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip' # Accélère le lancement des prochains jobs

      - name: Installer les dépendances
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Lancer le script
        run: python scrape_wellness_rapide.py

      # L'artefact reste disponible au téléchargement direct en haut du job (Zip)
      - name: Uploader les résultats (Sécurité)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-scraping
          path: |
            resultats_visibles.csv
            villes.csv

      # On ne commit QUE si le script Python s'est terminé proprement (success)
      # pour éviter d'envoyer des fichiers CSV corrompus par un timeout ou un crash.
      - name: Commit des résultats dans le dépôt
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Évite les erreurs si le fichier n'existe pas encore
          touch villes.csv resultats_visibles.csv
          
          git add villes.csv resultats_visibles.csv
          
          # On vérifie s'il y a de vrais changements avant de commit
          if ! git diff --staged --quiet; then
            git commit -m "Mise à jour résultats scraping [skip ci]"
            # Le pull --rebase évite le blocage si vous avez modifié un truc sur le web entre-temps
            git pull --rebase origin main
            git push origin main
          else
            echo "Aucun nouveau résultat à committer."
          fi
